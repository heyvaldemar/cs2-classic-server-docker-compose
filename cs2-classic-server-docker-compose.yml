# Image pin lives HERE, as an interpolation default, so `git pull` (or
# re-downloading this file) delivers the exact image this repository has
# tested. Set CS2_CLASSIC_SERVER_IMAGE_VERSION in .env to run a different
# version while the digest for it is fetched normally, or
# CS2_CLASSIC_SERVER_IMAGE_TAG to replace the whole reference. CI (the Trivy
# scan and check-pin-freshness) reads the pin from this line: this block is
# the single source of truth.
x-images:
  cs2-classic-server: &cs2-classic-server-image ${CS2_CLASSIC_SERVER_IMAGE_TAG:-joedwards32/cs2:${CS2_CLASSIC_SERVER_IMAGE_VERSION:-5.0.1@sha256:ae10b1aa8734498bb6f88d1cc803a88a9dbbb7d19fd37450747432ccc3a41653}}

# THE USER THE IMAGE RUNS AS, and so the owner of every file in the volume.
# A volume does not follow when an image moves its user, and joedwards32/cs2
# moved it twice in eight days in September 2026 (1000 to 999 and back). On
# the machine this template comes from, the first move left the server
# unable to write its logs for a day and a half while every health check
# stayed green. tests/image-user.sh asks the registry what the pinned image
# runs as and fails when it is not this, so a pin refresh that moves the user
# cannot ship as a patch. Compose ignores this key; it is read by that test.
x-image-user: "1000:1000"

services:
  # ONE SHOT, BEFORE THE SERVER: THE GAME DIRECTORY BELONGS TO THE GAME'S USER.
  # The server bind-mounts mapcycle.txt and gamemode_casual_server.cfg INSIDE
  # the install directory. On a volume that is still empty, Docker creates the
  # missing directories for those mount points, game/, game/csgo/ and
  # game/csgo/cfg/, owned by root, mode 0755, and the image runs as 1000.
  # SteamCMD then downloads all 73 GB into steamapps/, cannot move a single
  # file into game/, and stops with "Error! App '730' state is 0x602 after
  # update job"; the image tries three times, exits, restarts, and downloads
  # again, for as long as it runs. Measured in CI on 2026-11-09; up to v1.3.x
  # every first start on a fresh volume did this, and only a volume seeded
  # from a plain CS2 server's (see the end of this file) escaped it. This
  # container hands the install directory and those three directories to
  # 1000:1000 (x-image-user, above), and nothing else: a non-recursive chown
  # of four directories, every start, a no-op once they are right. It runs
  # the pinned image itself so that an empty volume is first filled from the
  # image, owner and mode included, exactly as the server would fill it.
  # tests/volume-owner.sh proves it both ways on a fresh volume.
  cs2-classic-server-init:
    image: *cs2-classic-server-image
    security_opt:
      - no-new-privileges:true
    # Root, with every capability dropped but the two this needs: CHOWN, and
    # DAC_OVERRIDE for a directory the game's user owns that is missing a
    # child (an install interrupted half-way).
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.5"
    network_mode: none
    entrypoint:
      - bash
      - -c
      - >-
        set -eu; d=/home/steam/cs2-dedicated;
        mkdir -p "$$d/game/csgo/cfg";
        chown 1000:1000 "$$d" "$$d/game" "$$d/game/csgo" "$$d/game/csgo/cfg";
        echo "the install directory and game/, game/csgo/, game/csgo/cfg/ belong to 1000:1000"
    volumes:
      - cs2-classic-server-data:/home/steam/cs2-dedicated
    restart: "no"

  cs2-classic-server:
    image: *cs2-classic-server-image
    depends_on:
      cs2-classic-server-init:
        condition: service_completed_successfully
    # Handles untrusted input from the internet and cannot gain privileges
    # through a setuid binary.
    security_opt:
      - no-new-privileges:true
    # 6g, and the reason it is not 4g like the plain CS2 server: peak reads
    # 14 GB on the machine this template comes from, which is SteamCMD's page
    # cache during a game update, not the server — resident stays under 1 GB.
    # Cache is reclaimed under a limit, never OOM-killed, so the ceiling only
    # has to clear the resident set with room for a workshop download.
    deploy:
      resources:
        limits:
          memory: ${CS2_CLASSIC_SERVER_MEMORY_LIMIT:-6g}
          cpus: "${CS2_CLASSIC_SERVER_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${CS2_CLASSIC_SERVER_MEMORY_RESERVATION:-1g}
          cpus: "${CS2_CLASSIC_SERVER_CPU_RESERVATION:-0.5}"
    ports:
      # THE NUMBER MUST MATCH INSIDE AND OUT. Steam's server list records the
      # port the server binds, not the one you forwarded. Publish 27019 for a
      # server bound on 27015 and the list hands players an address where a
      # different server answers: the connection succeeds, the handshake fails
      # against the wrong game, and every log line blames the client. Running
      # this next to a plain CS2 server? Give this one 27019 in .env and let
      # BOTH sides of the mapping carry it.
      - "${CS2_CLASSIC_SERVER_PORT:-27015}:${CS2_CLASSIC_SERVER_PORT:-27015}/udp"
      - "${CS2_CLASSIC_SERVER_PORT:-27015}:${CS2_CLASSIC_SERVER_PORT:-27015}/tcp"
    environment:
      # ITS OWN TOKEN. A Game Server Login Token drives one server only; a
      # token shared with another CS2 server logs both out. And workshop
      # downloads REQUIRE the token: without one the collection never arrives
      # and the server starts on whatever it has, silently.
      #
      # NO SECRET ON THE SERVER'S COMMAND LINE. The image puts SRCDS_TOKEN,
      # CS2_RCONPW and CS2_PW on the game's command line (+sv_setsteamaccount,
      # +rcon_password, +sv_password), where every process in the container
      # and `ps` on the host can read them, through an eval that runs a ";" in
      # a password as a command. They go to the image empty (empty, not unset:
      # unset, the image's own default rcon password applies), and the real
      # values under names it does not read, to hooks/pre.sh, which writes them
      # into secrets.cfg; the server executes it at start (CS2_ADDITIONAL_ARGS)
      # and on every map (server.cfg). tests/secret-probe.sh proves no value
      # reaches a log or a command line.
      SRCDS_TOKEN: ""
      CS2_RCONPW: ""
      CS2_PW: ""
      CS2T_STEAM_TOKEN: ${CS2_CLASSIC_SERVER_STEAM_TOKEN:?set in .env - see .env.example}
      CS2T_RCON_PASSWORD: ${CS2_CLASSIC_SERVER_RCON_PASSWORD:?set in .env - see .env.example for generation command}
      CS2T_SERVER_PASSWORD: ${CS2_CLASSIC_SERVER_PASSWORD:-}
      CS2_ADDITIONAL_ARGS: "+exec secrets.cfg"
      # Dropped weapons cleared: more than this many on the map, or older
      # than this many seconds (hooks/pre.sh writes both into server.cfg).
      # 0 keeps them all until the map changes, and a server with only bots
      # on it then runs out of networkable entities and crashes.
      CS2T_WEAPON_MAX_BEFORE_CLEANUP: ${CS2_CLASSIC_SERVER_WEAPON_MAX_BEFORE_CLEANUP:-64}
      CS2T_WEAPON_AUTO_CLEANUP_TIME: ${CS2_CLASSIC_SERVER_WEAPON_AUTO_CLEANUP_TIME:-120}
      CS2_SERVERNAME: ${CS2_CLASSIC_SERVER_NAME:-CS2 Classic Maps}
      CS2_PORT: ${CS2_CLASSIC_SERVER_PORT:-27015}
      # NO CS2_RCON_PORT. The image starts `socat TCP-LISTEN:$CS2_RCON_PORT
      # -> 127.0.0.1:$CS2_PORT` before the game whenever it is set; it is meant
      # for a second port. Up to v1.3 this file set it to the game port itself,
      # so socat took TCP 27015 first and forwarded it to itself, the game
      # never got its rcon socket, and every rcon connection was closed
      # unanswered: measured on a real CS2 in CI on 2026-11-01. Unset, the game
      # serves rcon on the game port's TCP side, which is published below.
      # tests/rcon.sh fails if it comes back.
      # Added upstream in 5.0.0. Both carry the image's own defaults, so the
      # server behaves identically whether or not these are set — they are
      # here because a knob nobody can find is a knob that does not exist.
      # How strictly the server enforces its delta-tick budget; 2 is upstream's
      # default.
      CS2_SERVER_DELTATICKS_ENFORCE: ${CS2_CLASSIC_SERVER_DELTATICKS_ENFORCE:-2}
      # Whether GOTV relays player voice. 1 is upstream's default; set 0 where
      # recording voice would be a privacy question rather than a feature.
      TV_RELAYVOICE: ${CS2_CLASSIC_SERVER_TV_RELAYVOICE:-1}
      CS2_MAXPLAYERS: ${CS2_CLASSIC_SERVER_MAX_PLAYERS:-10}
      CS2_GAMEALIAS: ${CS2_CLASSIC_SERVER_GAME_ALIAS:-casual}
      CS2_MAPGROUP: ${CS2_CLASSIC_SERVER_MAP_GROUP:-mg_active}
      CS2_STARTMAP: ${CS2_CLASSIC_SERVER_START_MAP:-de_dust2}
      # THE COLLECTION IS THE SERVER. A Steam Workshop collection of the maps
      # to host; the server downloads it at start and switches into workshop
      # mode. The rotation in mapcycle.txt names maps that have to be IN it.
      CS2_HOST_WORKSHOP_COLLECTION: ${CS2_CLASSIC_SERVER_WORKSHOP_COLLECTION:?set in .env - see .env.example}
      # The workshop map to start on, by its file id. Empty = the first in the
      # collection.
      CS2_HOST_WORKSHOP_MAP: ${CS2_CLASSIC_SERVER_WORKSHOP_START_MAP:-}
      CS2_BOT_QUOTA: ${CS2_CLASSIC_SERVER_BOT_QUOTA:-8}
      CS2_BOT_QUOTA_MODE: ${CS2_CLASSIC_SERVER_BOT_QUOTA_MODE:-fill}
      CS2_BOT_DIFFICULTY: ${CS2_CLASSIC_SERVER_BOT_DIFFICULTY:-2}
      CS2_LOG: ${CS2_CLASSIC_SERVER_LOG:-on}
      CS2_LOG_ECHO: ${CS2_CLASSIC_SERVER_LOG_ECHO:-1}
      TZ: ${CS2_CLASSIC_SERVER_TIMEZONE:-UTC}
    volumes:
      - cs2-classic-server-data:/home/steam/cs2-dedicated
      # The curated rotation, over the collection's full cycle.
      - ./mapcycle.txt:/home/steam/cs2-dedicated/game/csgo/mapcycle.txt:ro
      # Casual overrides: no warm-up, club-level bots that stay on an empty
      # server. exec'd after the gamemode defaults, so these win — WHERE THE
      # GAME LETS THEM. In workshop mode CS2 refuses some of them with
      # "DISALLOWED WORKSHOP CONVAR" in the log, bot_quota among them, and the
      # bots come back at the next map change. scripts/botguard.sh is the
      # answer to that; see the README.
      - ./gamemode_casual_server.cfg:/home/steam/cs2-dedicated/game/csgo/cfg/gamemode_casual_server.cfg:ro
      # The health check: A2S_INFO to the game port (see healthcheck: below).
      - ./tools/healthcheck.sh:/healthcheck.sh:ro
      # The image's pre-start hook, at the path it sources: the secrets into
      # secrets.cfg (see environment: above). At the volume's root, so Docker
      # creates no directory for it inside the game's tree (the 0x602 lesson
      # of v1.4.0).
      - ./hooks/pre.sh:/home/steam/cs2-dedicated/pre.sh:ro
    healthcheck:
      # THE GAME'S OWN ANSWER, NOT ITS PROCESS. tools/healthcheck.sh sends
      # A2S_INFO, the query every server browser sends, to the game port and is
      # healthy only on the engine's reply. Up to v1.3.3 this looked for cs2 in
      # /proc, which a hung or stopped game keeps; the real-server workflow
      # stops it with SIGSTOP and requires red. The log is not read either. A
      # map change silences it for seconds; the check tries twice and Docker
      # allows three misses at this interval. Each check ends within 7 seconds.
      # It asks from inside the container: it does not prove the port is
      # published on the host or open in a firewall.
      test: ["CMD", "bash", "/healthcheck.sh", "${CS2_CLASSIC_SERVER_PORT:-27015}"]
      interval: 60s
      timeout: 10s
      retries: 3
      # First boot downloads roughly 60 GB of game content through SteamCMD and
      # then the workshop collection. A short start_period marks the container
      # unhealthy for the whole of it.
      start_period: ${CS2_CLASSIC_SERVER_START_PERIOD:-90m}
    # srcds writes its state on the way out. Ten seconds and a SIGKILL is
    # enough to lose the last round and leave the game files mid-write.
    stop_grace_period: ${CS2_CLASSIC_SERVER_STOP_GRACE_PERIOD:-30s}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${CS2_CLASSIC_SERVER_LOG_MAX_SIZE:-10m}
        max-file: "${CS2_CLASSIC_SERVER_LOG_MAX_FILE:-3}"

# DECLARED EXTERNAL SO `docker compose down -v` CANNOT DELETE IT.
#
# This volume holds an 80 GB SteamCMD install of Counter-Strike 2 plus the
# workshop collection. As a project-managed volume it is one `down -v` away
# from being gone — and `down -v` is the command everybody reaches for when a
# stack misbehaves. On a metered connection it comes back twice: once in
# bytes and once on the bill.
#
# Create it before the first start:  docker volume create cs2-classic-server-data
#
# Running a plain CS2 server on the same host? Seed this volume from its
# volume once (`docker run --rm -v cs2-server-data:/from:ro -v
# cs2-classic-server-data:/to alpine cp -a /from/. /to/`) and skip the
# second 60 GB download.
volumes:
  cs2-classic-server-data:
    name: cs2-classic-server-data
    external: true
