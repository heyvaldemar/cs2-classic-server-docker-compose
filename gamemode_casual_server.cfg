// Casual overrides, exec'd after the casual gamemode defaults, so these win -
// where the game lets them. In workshop mode CS2 refuses some convars with
// "DISALLOWED WORKSHOP CONVAR" in the log and puts its own value back at the
// next map change; bot_quota is one of them. scripts/botguard.sh exists for
// exactly that case.

// No warm-up: straight into the match.
mp_warmuptime 0
mp_warmuptime_all_players_connected 0
mp_warmup_pausetimer 0

// Bots: club level - competent but fair (0 easy .. 3 expert), filling the
// teams. They stay on an EMPTY server too: the default of 1 holds them back
// until a human arrives, and the browser then shows 0 players and nothing to
// join, which reads as broken from outside.
bot_quota 8
bot_quota_mode fill
bot_join_after_player 0
bot_difficulty 2

// Rotate the curated list in mapcycle.txt; no end-of-match vote.
mp_endmatch_votenextmap 0
mapcyclefile "mapcycle.txt"

// Echo chat to the console so anything reading the log sees it. sv_logflush
// forces each line to disk; without it the engine buffers and a quiet server
// writes a log that reports zero bytes while people are talking.
log on
sv_logecho 1
sv_logflush 1
